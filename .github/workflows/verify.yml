name: Verify simulator
on:
  push:
    branches: [feature/marinelli-ownership-foundation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run syntax checks and regression tests
        run: npm run check
      - name: Check ownership and park adapter syntax
        run: |
          node --check public/ownership.js
          node --check public/park-link.js
